# Dependabot opens a pull request when a tool used by the workflows has a newer version.
# The site itself has no packages (plain HTML, CSS and JS), so GitHub Actions is the only thing to update.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
